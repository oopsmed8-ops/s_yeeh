# Render Blueprint: free Static Site, no sleep, no cold start.
# Sidahmed-auto
services:
  - type: web
    runtime: static
    name: sidahmed-auto
    buildCommand: node scripts/build.mjs
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Same-origin image proxy: photos load from this site, so phones/ISPs that block *.workers.dev still show them.
      - type: rewrite
        source: /media/*
        destination: https://auto-granato-upload.goko07339.workers.dev/images/*
      # Same-origin Supabase proxy: fallback for networks that block *.supabase.co.
      - type: rewrite
        source: /sb/*
        destination: https://ldjesrpnhnrwuxfzwldu.supabase.co/*
    envVars:
      - key: SITE_DOMAIN
        value: sidahmed-auto.onrender.com   # change to your final domain once connected
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://code.jquery.com https://cdn.datatables.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.datatables.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.workers.dev https://cdn.jsdelivr.net; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /admin.html
        name: X-Robots-Tag
        value: "noindex, nofollow, noarchive"
      - path: /admin.html
        name: Cache-Control
        value: "no-store"
      - path: /media/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /assets/js/*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /assets/css/*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /assets/img/*
        name: Cache-Control
        value: "public, max-age=604800"
